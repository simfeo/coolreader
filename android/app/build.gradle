apply plugin: 'com.android.application'

android {
    namespace 'org.coolreader'
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "30.0.15729638"
    defaultConfig {
        applicationId "org.coolreader"
        // NDK r28+ cannot target anything older than API 21.
        minSdk 21
        targetSdk 36
        // When new version released, version code must be incremented at least by 8
        // for compatibility with ABI versioning of split apk (see below).
        versionCode 32578
        versionName "3.2.59-2"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags ""
            }
        }
    }
    sourceSets {
        main {
            setRoot('src/main')
            aidl.srcDirs = ['../../android/src']
            java.srcDirs = ['../../android/src']
            res.srcDirs = ['../../android/res']
        }
    }
    // Release signing: keystore path and alias come from ~/.gradle/gradle.properties, the
    // password from the macOS Keychain item "7ui-signing", so neither lands in the repo.
    // Without them the release build is simply left unsigned.
    def keystorePath = findProperty('SEVENUI_KEYSTORE')
    def keyAliasProp = findProperty('SEVENUI_KEY_ALIAS')
    def keychainPassword = {
        try {
            def p = ['security', 'find-generic-password', '-s', '7ui-signing', '-w'].execute()
            def out = p.text.trim()
            p.waitFor() == 0 ? out : null
        } catch (Exception ignored) { null }
    }
    signingConfigs {
        release {
            if (keystorePath && keyAliasProp) {
                def pw = keychainPassword()
                if (pw) {
                    storeFile file(keystorePath)
                    storePassword pw
                    keyAlias keyAliasProp
                    keyPassword pw
                }
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
            // to make the bug report more readable.
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
            packaging {
                jniLibs.keepDebugSymbols += "**/*.so"
            }
        }
        release_stripped {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            jniDebuggable true
            debuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
            packaging {
                jniLibs.keepDebugSymbols += "**/*.so"
            }
        }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked"
        }
    }
    // https://developer.android.com/studio/build/configure-apk-splits
    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a' //select ABIs to build APKs for
            universalApk true //generate an additional APK that contains all the ABIs
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.31.6"
        }
    }
    lint {
        disable 'MissingTranslation'
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// Per-ABI split APKs get versionCode + small offset (old behaviour), so each ABI build
// supersedes the universal one on update.
def abiCodes = [
        'armeabi': 1,
        'armeabi-v7a': 2,
        'arm64-v8a': 6,
        'mips': 3,
        'mips64': 7,
        'x86': 4,
        'x86_64': 5
]
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }?.identifier
            def offset = abiCodes.get(abi)
            if (offset != null) {
                output.versionCode.set(output.versionCode.get() + offset)
            }
        }
    }
}

tasks.register('prepareKotlinBuildScriptModel')

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation project(path: ':genrescollection')
}
